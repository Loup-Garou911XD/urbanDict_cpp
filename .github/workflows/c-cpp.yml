name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name : install deps
      run: sudo apt-get install libcurl4-openssl-dev \
            libwxgtk3.2-dev
    - name: make
      run: make
